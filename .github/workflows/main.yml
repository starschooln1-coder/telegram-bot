name: Telegram postlar

on:
  schedule:
    - cron: "7 3 * * *"    # 08:07 Toshkent vaqti
    - cron: "7 14 * * *"   # 19:07 Toshkent vaqti
  workflow_dispatch:
    inputs:
      slot:
        description: "Qaysi post yuborilsin"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Postni yuborish
        run: python3 bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
          SLOT: ${{ inputs.slot }}
